<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Devansh.blog</title>
  <meta name="description" content="Secure administration dashboard login for Devansh.blog content management.">
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">

  <div style="position: absolute; top: 24px; right: 24px;">
    <button class="theme-toggle btn-icon" id="themeToggle" aria-label="Toggle theme">
      <i data-lucide="sun" class="theme-icon-light"></i>
      <i data-lucide="moon" class="theme-icon-dark"></i>
    </button>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i data-lucide="pen-line"></i>
      </div>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Sign in to manage your articles and media</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Username or Email</label>
        <input 
          type="text" 
          class="form-input" 
          id="loginUsername" 
          placeholder="admin or admin@example.com" 
          value="admin"
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input 
          type="password" 
          class="form-input" 
          id="loginPassword" 
          placeholder="Enter your password" 
          value="admin123"
          required 
          autocomplete="current-password"
        >
        <span class="form-hint">Default password is <code>admin123</code></span>
      </div>

      <div id="loginError" class="form-error" style="display:none; margin-bottom: 16px;"></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
        <span>Sign In</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </form>

    <div style="margin-top: 28px; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      <a href="../index.html" style="color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px;">
        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Return to Public Site
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
